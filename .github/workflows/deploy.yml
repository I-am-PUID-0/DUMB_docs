name: Validate documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

# Source validation and backend-channel promotion never publish Pages. Published
# documentation releases use publish-release.yml and their immutable tag instead.
concurrency:
  group: docs-validation-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release and development docs
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.sync.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache package downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: docs-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}

      - name: Install locked dependencies
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-root

      - name: Test documentation tooling
        run: poetry run python -m unittest discover -s tests -v

      - name: Check the latest stable backend release
        id: sync
        if: github.event_name != 'pull_request' && github.repository == 'I-am-PUID-0/DUMB_docs'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: poetry run python scripts/sync_release.py --write

      - name: Build release and development channels
        run: poetry run python scripts/build_docs.py

      - name: Audit release metadata and links
        run: poetry run python scripts/audit_seo.py site

      - name: Audit development metadata and links
        run: poetry run python scripts/audit_seo.py site/dev --base-url https://dumbarr.com/dev/ --development

      - name: Audit reader paths and audience boundaries
        run: poetry run python scripts/audit_reader_paths.py site

  promote:
    name: Record verified DUMB channel promotion
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'I-am-PUID-0/DUMB_docs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # stdlib only: the published proposal is recomputed and compared with the
      # exact metadata used by the successful build before any branch mutation.
      - name: Persist a verified release promotion
        id: promote
        env:
          # The protected branch permits the existing admin release actor.
          # Other steps retain the narrower repository installation token.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          DOCS_PROMOTION_METADATA: ${{ needs.build.outputs.metadata }}
          DOCS_VALIDATED_HEAD: ${{ github.sha }}
        run: python scripts/sync_release.py --publish --expected-head "$DOCS_VALIDATED_HEAD"
