name: Build and publish documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

# Publication and scheduled promotion share one queue. Never interrupt a Pages
# deployment after its release metadata has been accepted.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release and development docs
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.sync.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache package downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: docs-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}

      - name: Install locked dependencies
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-root

      - name: Test documentation tooling
        run: poetry run python -m unittest discover -s tests -v

      - name: Check the latest stable backend release
        id: sync
        if: github.event_name != 'pull_request' && github.repository == 'I-am-PUID-0/DUMB_docs'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: poetry run python scripts/sync_release.py --write

      - name: Build release and development channels
        run: poetry run python scripts/build_docs.py

      - name: Audit release metadata and links
        run: poetry run python scripts/audit_seo.py site

      - name: Audit development metadata and links
        run: poetry run python scripts/audit_seo.py site/dev --base-url https://dumbarr.com/dev/ --development

      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request' && github.repository == 'I-am-PUID-0/DUMB_docs'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish validated documentation
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'I-am-PUID-0/DUMB_docs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # stdlib only: the published proposal is recomputed and compared with the
      # exact metadata used by the successful build before any branch mutation.
      - name: Persist a verified release promotion
        id: promote
        env:
          # The protected branch permits the existing admin release actor.
          # Other steps retain the narrower repository installation token.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          DOCS_PROMOTION_METADATA: ${{ needs.build.outputs.metadata }}
          DOCS_VALIDATED_HEAD: ${{ github.sha }}
        run: python scripts/sync_release.py --publish --expected-head "$DOCS_VALIDATED_HEAD"

      - name: Confirm this artifact still matches the branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_VALIDATED_HEAD: ${{ steps.promote.outputs.commit_sha }}
        run: python scripts/sync_release.py --assert-current --expected-head "$DOCS_VALIDATED_HEAD"

      - uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment

      # Both destinations receive the same validated artifact. The optional legacy
      # mirror preserves the DUMB repository's existing gh-pages deployment.
      - name: Download validated artifact for the legacy mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCS_RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$DOCS_RUN_ID" --name github-pages --dir /tmp/docs-pages
          mkdir -p /tmp/docs-mirror
          tar -xf /tmp/docs-pages/artifact.tar -C /tmp/docs-mirror

      - name: Confirm the mirror still matches the branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_VALIDATED_HEAD: ${{ steps.promote.outputs.commit_sha }}
        run: python scripts/sync_release.py --assert-current --expected-head "$DOCS_VALIDATED_HEAD"

      - name: Mirror to DUMB gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: I-am-PUID-0/DUMB
          personal_token: ${{ secrets.DMB_MIRROR_TOKEN }}
          publish_dir: /tmp/docs-mirror
          publish_branch: gh-pages
