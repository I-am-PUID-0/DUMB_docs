name: Publish documentation release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published docs tag to deploy (blank selects the latest release)'
        required: false
        type: string
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

# Serialize both Pages and the legacy mirror. A release superseded while waiting
# is rejected by the publication checks rather than rolling the site backward.
concurrency:
  group: docs-release-pages
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch release publication from master
    if: github.event_name == 'release' && github.repository == 'I-am-PUID-0/DUMB_docs' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # The existing Pages environment allows master, not tag refs. Keep that
      # policy and dispatch the trusted workflow; its build still checks out the
      # exact published release commit, never the moving master content.
      - name: Queue the published release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DOCS_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run publish-release.yml --ref master -f release_tag="$DOCS_RELEASE_TAG"

  resolve:
    name: Select the latest published docs release
    if: github.event_name != 'release' && github.repository == 'I-am-PUID-0/DUMB_docs' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify the published release and immutable tag
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$DOCS_RELEASE_TAG" ]; then
            python scripts/published_docs_release.py --tag "$DOCS_RELEASE_TAG"
          else
            python scripts/published_docs_release.py
          fi

  build:
    name: Build the tagged documentation release
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: docs-${{ runner.os }}-py311-${{ hashFiles('poetry.lock') }}
      - name: Install locked dependencies
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-root
      - name: Test documentation tooling
        run: poetry run python -m unittest discover -s tests -v
      - name: Build the exact docs release without changing channel metadata
        env:
          DOCS_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: poetry run python scripts/build_docs.py --release-tag "$DOCS_RELEASE_TAG"
      - name: Audit release metadata and links
        run: poetry run python scripts/audit_seo.py site
      - name: Audit development metadata and links
        run: poetry run python scripts/audit_seo.py site/dev --base-url https://dumbarr.com/dev/ --development
      - name: Audit reader paths and audience boundaries
        run: poetry run python scripts/audit_reader_paths.py site
      - name: Verify the built release identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DOCS_RELEASE_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: python scripts/published_docs_release.py --tag "$DOCS_RELEASE_TAG" --expected-head "$DOCS_RELEASE_SHA" --artifact site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish the verified docs release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      # Check release eligibility with current trusted policy, while the artifact
      # itself remains the exact, separately verified release tree.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download the validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCS_RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$DOCS_RUN_ID" --name github-pages --dir /tmp/docs-pages
          mkdir -p /tmp/docs-mirror
          tar -xf /tmp/docs-pages/artifact.tar -C /tmp/docs-mirror
      - name: Recheck the latest release and artifact before Pages publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DOCS_RELEASE_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: python scripts/published_docs_release.py --tag "$DOCS_RELEASE_TAG" --expected-head "$DOCS_RELEASE_SHA" --artifact /tmp/docs-mirror
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
      - name: Recheck the latest release before mirror publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCS_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DOCS_RELEASE_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: python scripts/published_docs_release.py --tag "$DOCS_RELEASE_TAG" --expected-head "$DOCS_RELEASE_SHA" --artifact /tmp/docs-mirror
      - name: Mirror the same release artifact to DUMB gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: I-am-PUID-0/DUMB
          personal_token: ${{ secrets.DMB_MIRROR_TOKEN }}
          publish_dir: /tmp/docs-mirror
          publish_branch: gh-pages
