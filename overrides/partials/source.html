{# Based on Zensical's MIT-licensed source link. Facts are populated by the theme. #}
<a href="{{ config.repo_url }}" title="{{ config.repo_name }} on GitHub" aria-label="{{ config.repo_name }} on GitHub" class="md-source" data-md-component="source">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <div class="md-source__repository">DUMB</div>
</a>
